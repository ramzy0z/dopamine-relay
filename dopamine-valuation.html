  } else if(margin>0&&margin<15){
    insightPool.push({title:"Margin expansion to 15-20%+ is the highest-value operational focus",body:"Moving from the current "+margin.toFixed(0)+"% EBITDA margin to a 15-20%+ profile could increase the implied valuation by 1.5-2.5x under EBITDA multiple methodologies, with no requirement to grow the top line. The priority sequence should be: pricing review, COGS renegotiation, then headcount efficiency."});
  } else if(margin>=15){
    insightPool.push({title:"Strong margins create capacity to invest aggressively in growth",body:"At "+margin.toFixed(0)+"% EBITDA margins, "+co+" has the operational leverage to reinvest in growth without deteriorating earnings quality. The strategic priority should shift to identifying the highest-ROI growth channels - geographic expansion, product adjacencies, or distribution partnerships - and deploying capital there with discipline."});
  }
  if(isGCCGeo){
    insightPool.push({title:"GCC-first depth before multi-region expansion",body:"Deepening penetration across GCC markets and codifying the operating playbook before entering higher-complexity regions (EU, US) will preserve capital and create a replicable, investable expansion blueprint. GCC-proven unit economics are increasingly valued by international growth investors as evidence of scalability."});
  }
  if(!raised&&rev<5e6){
    insightPool.push({title:"Institutional fundraising readiness: build the metrics story now",body:"Pre-Series A investors will require three to six months of demonstrable momentum: consistent MoM revenue growth, improving unit economics, and a repeatable go-to-market motion. Investing in the data infrastructure to track and present these metrics compellingly will compress the fundraising timeline and improve deal terms."});
  } else if(raised&&/series a|seed/i.test(stage)&&rev<10e6){
    insightPool.push({title:"Series B readiness requires demonstrating repeatability at scale",body:"Series B investors look for proof that the early-stage growth motion is repeatable and non-idiosyncratic. The key proof points are: NRR above 110% (if B2B), consistent new logo acquisition with declining CAC, and gross margin expansion. Building these metrics into the operating cadence now accelerates the next round."});
  }
  if(isB2BSector&&rev>=2e6){
    insightPool.push({title:"Net revenue retention expansion delivers higher ROI than new logo acquisition",body:"In B2B models, improving NRR from baseline to 120%+ through structured upsell, cross-sell, and expansion programmes is typically 3-5x more capital-efficient than acquiring new logos. At "+co+"'s current revenue scale, a focused account expansion motion should be the primary commercial priority."});
  }
  if(isTravelLifestyle||isFashionLifestyle||isPersonalised){
    insightPool.push({title:"Customer data infrastructure is the core long-term strategic asset",body:"Every customer interaction - purchase history, preferences, returns, browsing behaviour - is a data point that compounds into a proprietary personalisation engine. Investing in data capture and CRM infrastructure now creates a competitive moat that is structurally difficult for incumbents to replicate, and substantially increases the business's attractiveness to acquirers."});
  }

  const insightFallback={title:"Strategic distribution partnerships can accelerate the growth trajectory",body:"Identifying two to three non-competing platforms or channel partners with access to "+co+"'s target customer profile can materially compress the CAC curve while generating market validation signal that strengthens the next fundraising or M&A process. Prioritise partnerships offering co-marketing, embedded distribution, or data sharing benefits."};
  const insightFallback2={title:"Operational excellence as a compounding competitive differentiator",body:"Building repeatable, measurable operational processes across sales, customer success, and finance creates an advantage that compounds as the business scales and becomes increasingly difficult for less disciplined competitors to match. Operational excellence is the foundation of the margin expansion story that drives valuation multiple re-rating."};

  const finalInsights=insightPool.slice(0,2);
  if(finalInsights.length<1)finalInsights.push(insightFallback);
  if(finalInsights.length<2)finalInsights.push(insightFallback2);

  return{
    pros:finalPros.slice(0,3),
    cons:finalCons.slice(0,3),
    insights:finalInsights.slice(0,2)
  };
}

// ===== FUNDRAISE READINESS SCORECARD =====
function FundraiseReadiness({gate,cfg}){
  const [result,setResult]=useState(null);
  const [loading,setLoading]=useState(true);
  const [open,setOpen]=useState(false);

  useEffect(()=>{
    let cancelled=false;
    const analyze=async()=>{
      setLoading(true);

      // Build dimensions dynamically based on AVAILABLE data only
      const rev=cfg.revenue||0;
      const ebitda=cfg.ebitda||0;
      const margin=rev>0?((ebitda/rev)*100):null;
      const hasRaised=gate.raised==="Yes";
      const stage=gate.stage||"";
      const lastRaiseRev=gate.lastRaiseRevenue||0;
      const sector=gate.sector||"";
      const geo=gate.geo||"";
      const desc=gate.description||"";

      // Only include dimensions where we have concrete, factual data
      const dims=[];
      dims.push("revenue_scale: The company reports $"+rev.toLocaleString()+" in annual revenue. Score whether this revenue level is appropriate for their sector ("+sector+") and stage ("+( stage||"unknown")+"). Base your score ONLY on the revenue figure relative to typical stage benchmarks.");
      if(margin!==null){
        dims.push("profitability: The company has an EBITDA margin of "+margin.toFixed(1)+"% ($"+ebitda.toLocaleString()+" EBITDA on $"+rev.toLocaleString()+" revenue). Score the margin quality relative to "+sector+" sector benchmarks. Base your score ONLY on the actual margin figure provided.");
      }
      if(hasRaised&&lastRaiseRev>0&&rev>0){
        dims.push("revenue_progression: The company had $"+lastRaiseRev.toLocaleString()+" revenue at its last fundraise and now reports $"+rev.toLocaleString()+". Score the progression. Base your score ONLY on these two actual revenue figures.");
      }
      if(hasRaised&&stage){
        dims.push("stage_readiness: The company is at "+stage+" stage with $"+rev.toLocaleString()+" revenue"+(margin!==null?" and "+margin.toFixed(1)+"% EBITDA margin":"")+". Score whether these metrics meet typical thresholds for advancing to the next funding stage. Base your score ONLY on the provided financial data vs. stage benchmarks.");
      }
      dims.push("market_context: The company operates in "+sector+" in "+geo+". Based on the company description ("+desc.substring(0,200)+"), score how clearly the company has a defined, addressable market position. Do NOT speculate about competitive dynamics you cannot verify from the description.");

      const dimList=dims.map((d,i)=>(i+1)+". "+d).join("\n");

      try{
        const co=gate.companyName||"The company";
        const systemPrompt="You are a senior venture capital partner. You ONLY score dimensions where you have been given concrete data. You NEVER infer, guess, or hallucinate metrics. If a dimension requires information not provided, you score it conservatively and explicitly state what data is missing. Never use em dashes.";
        const userPrompt="Score this company's fundraise readiness based ONLY on the factual data provided below. Do NOT infer or assume any data not explicitly given.\n\nCompany: "+co+"\nSector: "+sector+"\nGeography: "+geo+"\nDescription: "+desc+"\nAnnual Revenue: $"+rev.toLocaleString()+"\nEBITDA: $"+ebitda.toLocaleString()+(margin!==null?"\nEBITDA Margin: "+margin.toFixed(1)+"%":"")+"\nHas raised: "+(gate.raised||"No")+(stage?"\nCurrent stage: "+stage:"")+(lastRaiseRev>0?"\nRevenue at last raise: $"+lastRaiseRev.toLocaleString():"")+"\n\nScore ONLY these dimensions (0 to 100), with a 15 to 25 word note for each:\n"+dimList+"\n\nCRITICAL RULES:\n- Score ONLY based on the specific data points provided for each dimension\n- If you cannot score accurately without additional data, give a score of 50 and state what is missing\n- Do NOT invent growth rates, retention metrics, or competitive positions not stated in the data\n- Notes must reference the actual numbers provided\n\nAlso provide:\n- overall_grade: Letter grade (A+, A, B+, B, C+, C, D)\n- overall_label: 3 to 5 word label\n- summary: 40 to 60 word summary referencing ONLY the actual data provided, with specific next steps\n\nRespond with ONLY valid JSON. Use the exact dimension keys from above (revenue_scale, profitability, revenue_progression, stage_readiness, market_context). Only include dimensions that were listed above.";

        const resp=await fetch(RELAY_BASE+"/claude",{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({model:"claude-sonnet-5",max_tokens:1500,messages:[{role:"user",content:userPrompt}],system:systemPrompt})
        });
        const data=await resp.json();
        const textBlock=(data.content||[]).find(b=>b.type==="text");
        if(textBlock&&textBlock.text){
          const parsed=JSON.parse(textBlock.text.replace(/```json|```/g,"").trim());
          if(!cancelled) setResult(parsed);
        }
      }catch(e){
        console.warn("Fundraise readiness failed:",e);
        if(!cancelled) setResult(null);
      }
      if(!cancelled) setLoading(false);
    };
    analyze();
    return()=>{cancelled=true;};
  },[gate,cfg]);

  const barColor=(score)=>score>=70?"var(--ng)":score>=45?"#f5a623":"var(--sp)";
  const gradeColor=(g)=>/^A/.test(g)?"var(--ng)":/^B/.test(g)?"#0066cc":/^C/.test(g)?"#f5a623":"var(--sp)";

  if(loading){
    return(
      <div className="mod">
        <div className="mod-hdr" style={{cursor:"default"}}>
          <div className="mod-title"><div className="mod-icon" style={{background:"var(--sb)"}}>M</div>M&amp;A Readiness Scorecard</div>
        </div>
        <div className="mod-body">
          <div className="ai-loader-wrap">
            <div className="ai-loader-ring"></div>
            <div className="ai-loader-brand">Wusool AI</div>
            <div className="ai-loader-status">Evaluating M&amp;A readiness<span className="ai-loader-dots"><span>.</span><span>.</span><span>.</span></span></div>
          </div>
        </div>
      </div>
    );
  }
  if(!result)return null;

  // Build display dimensions dynamically from what was returned
  const dimLabels={
    revenue_scale:"Revenue Scale",
    profitability:"Profitability",
    revenue_progression:"Revenue Progression",
    stage_readiness:"Stage Readiness",
    market_context:"Market Context"
  };
  const activeDims=Object.keys(dimLabels).filter(k=>result[k]&&typeof result[k].score==="number");

  return(
    <div className="mod">
      <div className="mod-hdr" onClick={()=>setOpen(!open)}>
        <div className="mod-title"><div className="mod-icon" style={{background:"var(--sb)"}}>M</div>M&amp;A Readiness Scorecard<span className="dcf-auto-badge">AI-powered</span></div>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <span style={{fontSize:13,fontWeight:700,color:gradeColor(result.overall_grade||"C")}}>{result.overall_grade||"N/A"}</span>
          <span className="mod-toggle">{open?"\u25BC":"\u25B6"}</span>
        </div>
      </div>
      {open&&<div className="mod-body">
        <div style={{textAlign:"center",marginBottom:20}}>
          <div className="scorecard-letter" style={{color:gradeColor(result.overall_grade||"C")}}>{result.overall_grade||"N/A"}</div>
          <div className="scorecard-label">{result.overall_label||"Assessment Complete"}</div>
        </div>
        {activeDims.map(key=>{
          const item=result[key];
          return(
            <div key={key} className="scorecard-bar-wrap">
              <div className="scorecard-bar-label"><span>{dimLabels[key]}</span><span style={{color:barColor(item.score)}}>{item.score}/100</span></div>
              <div className="scorecard-bar-track"><div className="scorecard-bar-fill" style={{width:item.score+"%",background:barColor(item.score)}}/></div>
              <div style={{fontSize:11,color:"var(--gg)",marginTop:3}}>{item.note}</div>
            </div>
          );
        })}
        {result.summary&&<div className="scorecard-summary">{result.summary}</div>}
      </div>}
    </div>
  );
}

// ===== ATTIO CRM INTEGRATION =====
// Uses /submit-lead endpoint which writes to three Attio targets in one call:
//   1. Upsert Companies record (domain as dedup key)
//   2. Add to Lead Magnet Inbound list
//   3. Add to Seller Database list (with revenue + EBITDA in AED, contact details)
// USD -> AED conversion at 3.6725 peg happens server-side.
async function pushLeadToAttio(gateData,cfgData,blendedData){
  const SUBMIT_URL=RELAY_BASE+"/submit-lead";

  if(!gateData.domain||!gateData.domain.trim()){
    console.warn("[Attio] Skipped, no domain provided.");
    return;
  }

  const payload={
    companyName: gateData.companyName||"",
    domain:      gateData.domain.trim(),
    description: gateData.description||"",
    sector:      gateData.sector||"",
    geo:              gateData.geo||"",
    contactName:      gateData.name||"",
    contactEmail:     gateData.email||"",
    revenueUsd:       cfgData.revenue||0,
    ebitdaUsd:        cfgData.ebitda||0,
    ownerSalaryUsd:   gateData.ownerSalary||0,
    leadSource:       "Valuation Tool",
    valuationLowUsd:  blendedData?blendedData.low:undefined,
    valuationMidUsd:  blendedData?blendedData.mid:undefined,
    valuationHighUsd: blendedData?blendedData.high:undefined
  };

  console.group("[Attio] Submitting lead",payload.companyName,"|",payload.domain);
  try{
    const doFetch=async(attempt=1)=>{
      try{
        const ctrl=new AbortController();
        const timer=setTimeout(()=>ctrl.abort(),55000);
        const r=await fetch(SUBMIT_URL,{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify(payload),
          signal:ctrl.signal
        });
        clearTimeout(timer);
        return r;
      }catch(e){
        if(attempt<2){
          console.log("[Attio] Relay waking up, retrying in 3s...");
          await new Promise(r=>setTimeout(r,3000));
          return doFetch(2);
        }
        throw e;
      }
    };

    const resp=await doFetch();
    if(!resp.ok){
      console.warn("[Attio] Submission failed. HTTP",resp.status);
      console.groupEnd();
      return;
    }
    const d=await resp.json();
    if(d.ok){
      console.log("[Attio] Lead captured. Record ID:",d.recordId);
      console.log("[Attio] Financials written (AED):",d.aed);
      console.log("[Attio] Write log:",d.log);
    }else{
      console.warn("[Attio] Submission error:",d);
    }
  }catch(e){
    console.warn("[Attio] Network error:",e.message||e);
  }
  console.groupEnd();
}

// ===== DYNAMIC COMPS (Claude-powered) =====
function DynamicCompsLoader({gate,onCompsReady,onStatusChange}){
  const [status,setStatus]=useState("idle");
  const loaded=useRef(false);

  useEffect(()=>{
    if(loaded.current)return;
    loaded.current=true;
    const fetchComps=async()=>{
      setStatus("loading");
      if(onStatusChange)onStatusChange("loading");
      try{
        const co=gate.companyName||"";
        const desc=gate.description||"";
        const sector=gate.sector||"";
        const websiteText=gate.websiteText||"";

        const systemPrompt="You are a senior equity research analyst. You select the most relevant public company comparables for valuation analysis. Be precise with financial data. Never use em dashes. You have access to web search: use it to verify what the target company does and to find accurate, current enterprise value, revenue, and EBITDA figures for the comparables you choose. Do not rely on memory for financial figures.";
        const userPrompt="Research this company and select the 8 most relevant public company comparables an investment banker would use in a trading comps analysis:\n\nCompany: "+co+"\nSector: "+sector+"\nDescription: "+desc+"\n"+(websiteText?"Website: "+websiteText.substring(0,800)+"\n":"")+"\nUse web search first to confirm what the target actually does, then choose comparables that genuinely match its business model, and look up approximate current EV ($M), annual revenue ($M), and EBITDA ($M) for each. Prefer comparables of a broadly relevant scale where possible.\n\nInclude a mix of:\n- Direct competitors or peers\n- Companies with similar business models in adjacent sectors\n- Regional comparables if relevant (especially MENA-listed companies if the target is in the Middle East)\n\nRespond with ONLY valid JSON (no markdown, no backticks):\n{\"comps\":[{\"co\":\"Company Name\",\"tk\":\"TICKER\",\"ev\":0,\"rev\":0,\"ebitda\":0}]}";

        const ctrl=new AbortController();
        const timer=setTimeout(()=>ctrl.abort(),90000);
        const resp=await fetch(RELAY_BASE+"/claude",{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({model:"claude-sonnet-5",max_tokens:4000,messages:[{role:"user",content:userPrompt}],system:systemPrompt,tools:[{type:"web_search_20260209",name:"web_search",max_uses:6}]}),
          signal:ctrl.signal
        });
        clearTimeout(timer);
        const data=await resp.json();
        const textBlocks=(data.content||[]).filter(b=>b.type==="text"&&b.text).map(b=>b.text);
        for(let i=textBlocks.length-1;i>=0;i--){
          const m=textBlocks[i].replace(/```json|```/g,"").trim().match(/\{[\s\S]*\}/);
          if(!m)continue;
          try{
            const parsed=JSON.parse(m[0]);
            if(parsed.comps&&parsed.comps.length>=3){
              onCompsReady(parsed.comps);
              setStatus("done");
              if(onStatusChange)onStatusChange("done");
              return;
            }
          }catch(e){}
        }
      }catch(e){
        console.warn("Dynamic comps failed:",e);
      }
      setStatus("fallback");
      if(onStatusChange)onStatusChange("fallback");
    };
    fetchComps();
  },[gate]);

  if(status==="loading")return(
    <div className="dcf-auto-note" style={{display:"flex",alignItems:"center",gap:8}}>
      <div style={{width:14,height:14,border:"2px solid #e0e0e0",borderTopColor:"var(--ng)",borderRadius:"50%",animation:"spin 0.8s linear infinite",flexShrink:0}}></div>
      <span>AI is selecting the most relevant comparable companies for {gate.companyName}...</span>
    </div>
  );
  if(status==="done")return null;
  return null;
}

            {/* Remainder - subheaders sharp like Key Strengths, only the bullets blurred and clamped short */}
            <div style={{marginTop:10}}>
              <div className="strat-section-title cons" style={{marginBottom:7}}><span>&#x26A0;</span> Risks &amp; Challenges</div>
              {blurredRisk&&(
                <div style={{filter:"blur(4.5px)",pointerEvents:"none",userSelect:"none",opacity:0.6,marginBottom:10,maxHeight:38,overflow:"hidden"}} aria-hidden="true">
                  <div className="strat-item con" style={{marginBottom:0,padding:"9px 12px"}}>
                    <div className="strat-item-icon">-</div>
                    <div className="strat-item-text"><strong>{blurredRisk.title}</strong>{blurredRisk.body}</div>
                  </div>
                </div>
              )}
              <div className="strat-section-title insights" style={{marginBottom:7}}><span>&#x27A4;</span> Strategic Insight</div>
              {blurredInsight&&(
                <div style={{filter:"blur(4.5px)",pointerEvents:"none",userSelect:"none",opacity:0.6,maxHeight:38,overflow:"hidden"}} aria-hidden="true">
                  <div className="strat-item insight" style={{marginBottom:0,padding:"9px 12px"}}>
                    <div className="strat-item-icon">&#x2192;</div>
                    <div className="strat-item-text"><strong>{blurredInsight.title}</strong>{blurredInsight.body}</div>
                  </div>
                </div>
              )}
            </div>
          </div>
          )}
        </div>
      </div>

      {/* 2. VALUATION HERO - big number sharp, breakdown table blurred */}
      <div id="locked-valuation-hero" data-scroll-stop>
        <ValuationSummary gate={gate} cfg={cfg} vd={vd} unlocked={false}/>
      </div>

      {/* 3. REMAINING MODULES - titles sharp, bodies blurred */}
      <div style={{marginTop:16}}>
        {otherSections.map((s,i)=>(
          <div key={i} className="mod" data-scroll-stop style={{marginBottom:12,border:"1px solid #ebebeb",borderRadius:8,overflow:"hidden",background:"#fff"}}>
            <div className="mod-hdr" style={{cursor:"default",padding:"14px 18px",borderBottom:"1px solid #f0f0f0"}}>
              <div className="mod-title"><div className="mod-icon" style={{background:"var(--sb)"}}>{s.icon}</div>{s.title}</div>
            </div>
            <div style={{position:"relative",padding:"16px 18px"}}>
              <div style={{filter:"blur(4px)",pointerEvents:"none",userSelect:"none",opacity:0.5}} aria-hidden="true">
                <div style={{fontSize:13,color:"#444",marginBottom:8}}>{s.sub}</div>
                <div style={{height:10,background:"#e8e8e8",borderRadius:4,marginBottom:8,width:"90%"}}/>
                <div style={{height:10,background:"#e8e8e8",borderRadius:4,marginBottom:8,width:"75%"}}/>
                <div style={{height:10,background:"#e8e8e8",borderRadius:4,width:"82%"}}/>
              </div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}


// ===== SCROLL HINT (minimalist jump-to-hero indicator) =====
function ScrollHint(){
  const [progress,setProgress]=useState(0); // 0..1 scroll position
  const [atBottom,setAtBottom]=useState(false);
  useEffect(()=>{
    const onScroll=()=>{
      const doc=document.documentElement;
      const max=(doc.scrollHeight-window.innerHeight)||1;
      const p=Math.min(1,Math.max(0,window.scrollY/max));
      setProgress(p);
      setAtBottom(window.scrollY>=max-80);
    };
    onScroll();
    window.addEventListener("scroll",onScroll,{passive:true});
    window.addEventListener("resize",onScroll);
    return()=>{window.removeEventListener("scroll",onScroll);window.removeEventListener("resize",onScroll);};
  },[]);
  const jump=()=>{
    if(atBottom){window.scrollTo({top:0,behavior:"smooth"});return;}
    // Advance to the next section heading below the current viewport, else one viewport down.
    const anchors=Array.from(document.querySelectorAll("[data-scroll-stop]"));
    const threshold=window.scrollY+window.innerHeight*0.5;
    const next=anchors.map(a=>a.getBoundingClientRect().top+window.scrollY).filter(top=>top>threshold).sort((a,b)=>a-b)[0];
    if(next!==undefined)window.scrollTo({top:next-24,behavior:"smooth"});
    else window.scrollBy({top:window.innerHeight*0.85,behavior:"smooth"});
  };
  return(
    <button className="scroll-hint" onClick={jump} aria-label={atBottom?"Back to top":"Scroll down"}>
      <span className="sh-label">{atBottom?"Top":"Scroll"}</span>
      <span className="sh-track"><span className="sh-fill" style={{height:(progress*100)+"%"}}/></span>
      <span className={"sh-chev"+(atBottom?" sh-chev-up":"")}>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </span>
    </button>
  );
}


// ===== APP =====
function App(){
  const [gated,setGated]=useState(false);
  const [gate,setGate]=useState(null);
  const [cfg,setCfg]=useState({revenue:0,ebitda:0});
  const [aiComps,setAiComps]=useState(null);
  const [aiCompsStatus,setAiCompsStatus]=useState("idle");
  const [resultsReady,setResultsReady]=useState(false);
  const [reportUnlocked,setReportUnlocked]=useState(false);
  const [teaserData,setTeaserData]=useState(null);
  const [teaserStatus,setTeaserStatus]=useState("idle");
  const [vd,setVd]=useState({
    dcfEV:0,dcfEquity:0,
    trRevLow:0,trRevMid:0,trRevHigh:0,
    trEbLow:0,trEbMid:0,trEbHigh:0,
    txRevLow:0,txRevMid:0,txRevHigh:0,
    txEbLow:0,txEbMid:0,txEbHigh:0,
    indLow:0,indMid:0,indHigh:0
  });

  const handleGate=data=>{
    setGate(data);
    const adjEBITDA=(data.profitBeforeTax||0)+(data.ownerSalary||0);
    const cfgData={revenue:data.revenue,ebitda:adjEBITDA};
    setCfg(cfgData);
    setGated(true);
  };

  const upd=useCallback(u=>setVd(p=>({...p,...u})),[]);

  // Fetch the strategic teaser in parallel with comps, during the loading screen,
  // so the preview is fully ready the moment loading ends (no second wait).
  useEffect(()=>{
    if(!gated||!gate)return;
    let cancelled=false;
    setTeaserStatus("loading");
    (async()=>{
      const adjEBITDA=(gate.profitBeforeTax||0)+(gate.ownerSalary||0);
      const localCfg={revenue:gate.revenue,ebitda:adjEBITDA};
      const localFallback=()=>{
        try{
          const lp=generateStrategicAnalysis(gate,localCfg);
          return{strengths:lp.pros||[],risks:lp.cons||[],insights:lp.insights||[]};
        }catch(e){return{strengths:[],risks:[],insights:[]};}
      };
      try{
        const co=gate.companyName||"The company";
        const sector=gate.sector||"";
        const desc=(gate.description||"").substring(0,300);
        const sys="You are a senior M&A advisor at a top-tier investment bank. Never use em dashes. Write precise, specific, analytical points - never generic statements that could apply to any company.";
        const usr="Give exactly 2 strengths, 1 risk/challenge, and 1 strategic insight for this company, specific to its sector and business model. JSON only, no markdown:\n\nCompany: "+co+"\nSector: "+sector+(desc?"\nDescription: "+desc:"")+"\nGeography: "+(gate.geo||"")+"\n\nTitles 8 to 14 words, bold and declarative. Bodies 30 to 45 words. Never use em dashes or ** markdown.\n\nRespond with ONLY valid JSON:\n{\"strengths\":[{\"title\":\"...\",\"body\":\"...\"}],\"risks\":[{\"title\":\"...\",\"body\":\"...\"}],\"insights\":[{\"title\":\"...\",\"body\":\"...\"}]}";
        const resp=await fetch(RELAY_BASE+"/claude",{
          method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({model:"claude-sonnet-5",max_tokens:900,messages:[{role:"user",content:usr}],system:sys})
        });
        const data=await resp.json();
        const tb=(data.content||[]).find(b=>b.type==="text");
        if(tb&&tb.text){
          const parsed=JSON.parse(tb.text.replace(/```json|```/g,"").trim());
          const strip=s=>(s||"").replace(/\*\*/g,"");
          const st=(parsed.strengths||[]).map(x=>({title:strip(x.title),body:strip(x.body)}));
          const rk=(parsed.risks||[]).map(x=>({title:strip(x.title),body:strip(x.body)}));
          const ins=(parsed.insights||[]).map(x=>({title:strip(x.title),body:strip(x.body)}));
          if(st.length>=2&&!cancelled){setTeaserData({strengths:st,risks:rk,insights:ins});setTeaserStatus("done");return;}
        }
      }catch(e){console.warn("Teaser fetch failed, using local fallback:",e);}
      if(!cancelled){setTeaserData(localFallback());setTeaserStatus("done");}
    })();
    return()=>{cancelled=true;};
  },[gated,gate]);

  // Push to Attio with the MOST accurate valuation available. We wait for the
  // background AI comps to land (done/fallback) so the CRM captures the refined
  // number, not the preliminary one. A 50s failsafe ensures we always push even
  // if comps hang.
  const attioPushedRef=useRef(false);
  useEffect(()=>{
    if(!resultsReady||!gate||attioPushedRef.current)return;
    const compsSettled=aiCompsStatus==="done"||aiCompsStatus==="fallback";
    const doPush=()=>{
    if(attioPushedRef.current)return;
    attioPushedRef.current=true;
    const rev=cfg.revenue||0;const ebitda=cfg.ebitda||0;const hasEb=ebitda>0;
    const clamp=r=>{const s=[r.low,r.mid,r.high].sort((a,b)=>a-b);return{low:s[0],mid:s[1],high:s[2]};};
    const rows=[];
    if(vd.dcfEquity>0)rows.push(clamp({low:vd.dcfEquity*0.75,mid:vd.dcfEquity,high:vd.dcfEquity*1.25}));
    if(vd.trRevMid>0&&rev>0)rows.push(clamp({low:(vd.trRevLow||0)*rev,mid:vd.trRevMid*rev,high:(vd.trRevHigh||0)*rev}));
    if(hasEb&&vd.trEbMid>0)rows.push(clamp({low:(vd.trEbLow||0)*ebitda,mid:vd.trEbMid*ebitda,high:(vd.trEbHigh||0)*ebitda}));
    if(vd.txRevMid>0&&rev>0)rows.push(clamp({low:(vd.txRevLow||0)*rev,mid:vd.txRevMid*rev,high:(vd.txRevHigh||0)*rev}));
    if(vd.indMid>0&&rev>0)rows.push(clamp({low:(vd.indLow||0)*rev,mid:vd.indMid*rev,high:(vd.indHigh||0)*rev}));
    let blendedData=null;
    if(rows.length){
      const avg=arr=>arr.reduce((a,b)=>a+b,0)/arr.length;
      const raw={low:avg(rows.map(m=>m.low)),mid:avg(rows.map(m=>m.mid)),high:avg(rows.map(m=>m.high))};
      const s=[raw.low,raw.mid,raw.high].sort((a,b)=>a-b);
      blendedData={low:s[0],mid:s[1],high:s[2]};
    }
    pushLeadToAttio(gate,cfg,blendedData);
    };
    if(compsSettled){
      // Comps in; give vd a beat to propagate, then push the refined number.
      const t=setTimeout(doPush,2000);
      return()=>clearTimeout(t);
    }
    // Comps not settled yet: failsafe push at 50s so a lead is never lost.
    const failsafe=setTimeout(doPush,50000);
    return()=>clearTimeout(failsafe);
  },[resultsReady,gate,cfg,vd,aiCompsStatus]);

  // Failsafe: never let a hung teaser fetch block the results reveal.
  useEffect(()=>{
    if(!gated)return;
    const failsafe=setTimeout(()=>{
      setTeaserStatus(s=>s==="done"?s:"done");
      setTeaserData(d=>{
        if(d)return d;
        try{
          const adjEBITDA=(gate.profitBeforeTax||0)+(gate.ownerSalary||0);
          const lp=generateStrategicAnalysis(gate,{revenue:gate.revenue,ebitda:adjEBITDA});
          return{strengths:lp.pros||[],risks:lp.cons||[],insights:lp.insights||[]};
        }catch(e){return{strengths:[],risks:[],insights:[]};}
      });
    },12000);
    return()=>clearTimeout(failsafe);
  },[gated,gate]);


  const gateTimeRef=useRef(null);
  useEffect(()=>{
    if(gated&&!gateTimeRef.current)gateTimeRef.current=Date.now();
  },[gated]);

  // Reveal the preliminary valuation as soon as the teaser is ready, and NEVER
  // later than a 40s hard cap. The AI comps deliberately do NOT gate the reveal;
  // they keep running in the background and refine the range once the user
  // unlocks the full report. This keeps the initial wait short and honest.
  useEffect(()=>{
    if(!gated)return;
    const teaserFinished=teaserStatus==="done";
    const elapsed=Date.now()-(gateTimeRef.current||Date.now());
    if(teaserFinished){
      // Small minimum so the loading animation doesn't flash by too fast.
      const minDelay=Math.max(8000-elapsed,800);
      const timer=setTimeout(()=>setResultsReady(true),minDelay);
      return()=>clearTimeout(timer);
    }
    // Hard cap: reveal at 40s no matter what.
    const cap=setTimeout(()=>setResultsReady(true),Math.max(40000-elapsed,0));
    return()=>clearTimeout(cap);
  },[gated,teaserStatus]);

  // Pre-compute initial valuation estimates so summary is stable before LinkedIn unlock
  useEffect(()=>{
    if(!gate)return;
    const sector=gate.sector||"";
    const baseRev=gate.revenue||0;
    const adjEBITDA=(gate.profitBeforeTax||0)+(gate.ownerSalary||0);
    const baseMargin=baseRev>0?(adjEBITDA/baseRev)*100:5;
    const negEbitda=adjEBITDA<0;

    // --- DCF pre-calc ---
    const bench=getDamodaranBenchmark(sector);
    const growth=getIndustryGrowth(sector);
    const taxRate=getTaxRate(gate.geo||"");
    const sizePrem=baseRev<5000000?5:baseRev<20000000?4:baseRev<100000000?3:2;
    const ke=bench?parseFloat(bench.ke.toFixed(2)):12;
    const kd=bench?parseFloat(bench.kd.toFixed(2)):6;
    const eqVal=Math.max(baseRev*3,1000000);
    const waccVal=(eqVal/(eqVal))*(ke/100)+(sizePrem||3)/100;
    const yr=new Date().getFullYear();
    const rows=[];
    let prevRev=baseRev;
    const decels=[1,1,0.8,0.65,0.5];
    // For loss-making companies, model a path to profitability
    const targetMargin=Math.max(growth.ebitMarginImpr*5+5,15);
    const isLossMaking=baseMargin<0;
    for(let i=0;i<5;i++){
      const projRev=prevRev*(1+(growth.revGrowth/100)*decels[i]);
      let projMargin;
      if(isLossMaking){
        const t=(i+1)/5;
        const eased=t*t;
        projMargin=baseMargin+(targetMargin-baseMargin)*eased;
      }else{
        projMargin=baseMargin+(growth.ebitMarginImpr*(i+1));
      }
      const projEBITDA=projRev*(projMargin/100);
      const dep=projRev*(growth.daaPct/100);
      const ebit=projEBITDA-dep;
      const capex=projRev*(growth.capexPct/100);
      const nwc=Math.max((projRev-prevRev)*(growth.nwcPct/100),0);
      rows.push({ebit:Math.round(ebit),dep:Math.round(dep),capex:Math.round(capex),nwc:Math.round(nwc)});
      prevRev=projRev;
    }
    const taxR=taxRate/100;
    const gR=(growth.termGrowth||2)/100;
    let sumDFCF=0;
    let lastFCF=0;
    rows.forEach((r,i)=>{
      const nopat=r.ebit*(1-taxR);
      const fcf=nopat+r.dep-r.capex-r.nwc;
      const df=1/Math.pow(1+waccVal,i+1);
      sumDFCF+=fcf*df;
      lastFCF=fcf;
    });
    const denom=Math.max(waccVal-gR,0.001);
    const rawTV=(lastFCF*(1+gR))/denom/Math.pow(1+waccVal,rows.length);
    const tv=lastFCF<0?0:rawTV;
    const dcfEV=Math.max(sumDFCF+tv,0);
    const dcfEquity=Math.max(dcfEV,0);

    // --- Transaction comps pre-calc ---
    const txMatches=matchTransactions(sector,15);
    const txList=txMatches.map(idx=>MA_RAW[idx]);
    const txRevM=txList.filter(r=>r.r!=null&&r.r>0).map(r=>r.r);
    const txEbM=txList.filter(r=>r.b!=null&&r.b>0).map(r=>r.b);
    const txRS=getStats(txRevM),txES=getStats(txEbM);
    const txDRev=negEbitda?Math.min(60,100):40;
    const txDEb=negEbitda?Math.min(40,100):20;
    const txDiscR=1-txDRev/100,txDiscE=1-txDEb/100;

    // --- Industry research pre-calc ---
    const vcMatches=matchVCRounds(sector,gate.stage||"");
    const vcList=vcMatches.map(idx=>VC_RAW[idx]);
    const fyM=vcList.filter(r=>r.fm!=null).map(r=>r.fm);
    const fwM=vcList.filter(r=>r.fw!=null).map(r=>r.fw);
    const avgFy=fyM.length?fyM.reduce((a,b)=>a+b,0)/fyM.length:0;
    const avgFw=fwM.length?fwM.reduce((a,b)=>a+b,0)/fwM.length:0;
    const blendedVC=(avgFy+avgFw)/2||avgFy||avgFw;
    const allVCM=[...fyM,...fwM].filter(Boolean);
    const vcS=getStats(allVCM);
    const vcDisc=0.8;

    setVd(p=>({...p,
      dcfEV,dcfEquity,
      txRevLow:txRS.p25*txDiscR,txRevMid:txRS.avg*txDiscR,txRevHigh:txRS.p75*txDiscR,
      txEbLow:txES.p25*txDiscE,txEbMid:txES.avg*txDiscE,txEbHigh:txES.p75*txDiscE,
      indLow:vcS.p25*vcDisc,indMid:blendedVC*vcDisc,indHigh:vcS.p75*vcDisc
    }));
  },[gate]);

  // Pre-compute trading comps from static data initially
  useEffect(()=>{
    if(!gate)return;
    const sector=gate.sector||"";
    const resolved=resolveSector(sector);
    const adjEBITDA=(gate.profitBeforeTax||0)+(gate.ownerSalary||0);
    const negEbitda=adjEBITDA<0;
    let compsData=PUBLIC_COMPS[sector]||PUBLIC_COMPS[resolved]||[];
    if(!compsData.length){
      const mapped=SECTOR_TO_COMPS_KEY[sector]||SECTOR_TO_COMPS_KEY[resolved];
      if(mapped)compsData=PUBLIC_COMPS[mapped]||[];
    }
    if(!compsData.length){
      const words=sector.toLowerCase().split(/[\s&,]+/).filter(w=>w.length>2);
      for(const key of Object.keys(PUBLIC_COMPS)){
        if(words.some(w=>key.toLowerCase().includes(w))){compsData=PUBLIC_COMPS[key];break}
      }
    }
    if(compsData.length){
      const valid=compsData.filter(c=>c.rev>0);
      const revM=valid.map(c=>c.ev/c.rev);
      const ebM=valid.filter(c=>c.ebitda>0).map(c=>c.ev/c.ebitda);
      const rS=getStats(revM),eS=getStats(ebM);
      const adjDRev=negEbitda?50:30;
      const adjDEb=negEbitda?50:30;
      const disc=1-adjDRev/100,discEb=1-adjDEb/100;
      setVd(p=>({...p,
        trRevLow:rS.p25*disc,trRevMid:rS.median*disc,trRevHigh:rS.p75*disc,
        trEbLow:eS.p25*discEb,trEbMid:eS.median*discEb,trEbHigh:eS.p75*discEb
      }));
    }
  },[gate]);

  // When AI comps arrive, update trading comps in vd immediately
  useEffect(()=>{
    if(!aiComps||!aiComps.length||!gate)return;
    const adjEBITDA=(gate.profitBeforeTax||0)+(gate.ownerSalary||0);
    const negEbitda=adjEBITDA<0;
    const valid=aiComps.filter(c=>c.rev>0);
    const revM=valid.map(c=>c.ev/c.rev);
    const ebM=valid.filter(c=>c.ebitda>0).map(c=>c.ev/c.ebitda);
    const rS=getStats(revM),eS=getStats(ebM);
    const adjDRev=negEbitda?50:30;
    const adjDEb=negEbitda?50:30;
    const disc=1-adjDRev/100,discEb=1-adjDEb/100;
    setVd(p=>({...p,
      trRevLow:rS.p25*disc,trRevMid:rS.median*disc,trRevHigh:rS.p75*disc,
      trEbLow:eS.p25*discEb,trEbMid:eS.median*discEb,trEbHigh:eS.p75*discEb
    }));
  },[aiComps,gate]);

  if(!gated)return <Gate onSubmit={handleGate}/>;

  if(!resultsReady){
    return(
      <div>
        <div style={{display:"none"}}>
          <DynamicCompsLoader gate={gate} onCompsReady={(c)=>setAiComps(c)} onStatusChange={setAiCompsStatus}/>
        </div>
        <ResultsLoadingScreen gate={gate} compsStatus={aiCompsStatus}/>
      </div>
    );
  }

  return(
    <div className="app-wrap results-revealed">
      <div className="main">
        <div className="page-hdr" style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:12}}>
          <div>
            <h1>Valuation Analysis</h1>
            <p>{gate.companyName} | {gate.sector} | {gate.geo}</p>
          </div>
        </div>
        {reportUnlocked?(
          <div style={{position:"relative"}}>
            <div data-scroll-stop><ValuationSummary gate={gate} cfg={cfg} vd={vd} unlocked={true}/></div>
            <div style={{marginTop:24}}>
              <InputsCard gate={gate} cfg={cfg}/>
              <LinkedInGateV2 gate={gate} cfg={cfg} aiComps={aiComps} onUpdate={upd} vd={vd} unlocked={true}/>
            </div>
            <ScrollHint/>
          </div>
        ):(
        <div style={{position:"relative",marginTop:8}}>
          <LockedPreview gate={gate} cfg={cfg} vd={vd} teaserData={teaserData}/>
          <ScrollHint/>
          <div style={{position:"fixed",left:0,right:0,bottom:0,display:"flex",justifyContent:"center",zIndex:50,pointerEvents:"none",padding:"0 16px 24px"}}>
            <div style={{background:"#fff",border:"1px solid #e8e8e8",borderRadius:12,padding:"24px 32px",maxWidth:480,width:"100%",boxShadow:"0 -4px 24px rgba(0,9,54,0.10), 0 16px 48px rgba(0,9,54,0.22)",textAlign:"center",pointerEvents:"auto"}}>
              <div style={{display:"inline-flex",alignItems:"center",gap:6,background:"#f0fff8",border:"1px solid rgba(22,218,128,0.4)",borderRadius:8,padding:"4px 12px",fontSize:11,fontWeight:700,color:"#007a50",marginBottom:14,textTransform:"uppercase",letterSpacing:"0.5px"}}>Full Report Ready</div>
              <h2 style={{fontSize:20,fontWeight:800,color:"#000523",marginBottom:8,letterSpacing:"-0.3px",lineHeight:1.25}}>Get Your Free Valuation Report Now</h2>
              <p style={{fontSize:13,color:"#888",lineHeight:1.5,marginBottom:18}}>Your {gate.sector} business in {gate.geo} has been valued across multiple methods. Get your full report and our team will walk you through the complete analysis.</p>
              <a href="https://calendar.app.google/UfXxu6dBkZ8wjhnT6" target="_blank" rel="noopener noreferrer" onClick={()=>setReportUnlocked(true)} style={{display:"block",width:"100%",padding:"14px",background:"#000523",color:"#fff",borderRadius:8,fontSize:15,fontWeight:700,cursor:"pointer",textDecoration:"none",fontFamily:"Inter,sans-serif",boxSizing:"border-box"}}>Get Your Free Valuation Report Now →</a>
              <div style={{fontSize:11,color:"#aaa",marginTop:9}}>Free · No commitment · Response within 24 hours</div>
            </div>
          </div>
        </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
